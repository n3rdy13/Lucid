<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lucid">
<meta name="theme-color" content="#0b0c17">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" id="touchicon" href="">
<link rel="icon" id="favicon" href="">
<title>Lucid</title>
<style>
:root{--bg:#0b0c17;--bg2:#10121f;--panel:#151830;--panel2:#1d2140;--line:#272b4d;--text:#ebeaf7;--muted:#9a9dc0;--accent:#a78bfa;--accent2:#f472b6;--q:#f6c97f;--act:#b9b6dc;--danger:#f87171;--user:#2a2350;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
#app{position:fixed;left:0;right:0;top:var(--app-top,0);height:var(--app-h,100dvh);display:flex;flex-direction:column;max-width:900px;margin:0 auto}
#top{display:flex;align-items:center;gap:4px;padding:calc(env(safe-area-inset-top) + 6px) 8px 8px 12px;border-bottom:1px solid var(--line);background:rgba(11,12,23,.95);min-height:52px}
#top h1{flex:1;font-size:18px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .acts{display:flex;gap:4px;align-items:center}
#view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 28px}
#view.chatview{padding:0;display:flex;flex-direction:column;overflow:hidden}
#nav{display:flex;border-top:1px solid var(--line);background:var(--bg2);padding-bottom:env(safe-area-inset-bottom)}
#nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;color:var(--muted);text-decoration:none;font-size:11px}
#nav a.on{color:var(--accent)}
body.nonav #nav{display:none}
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#170f2b;border:0;border-radius:999px;padding:10px 18px;font-weight:650}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:6px 14px;font-size:14px}
.btn.danger{background:transparent;border:1px solid rgba(248,113,113,.5);color:var(--danger)}
.btn.full{width:100%;margin:6px 0}
.btn:disabled{opacity:.5}
.icon{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;border-radius:50%;color:var(--text)}
.icon:active{background:var(--panel2)}
input,textarea,select,.pick{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px 12px;font:16px/1.4 inherit;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex-shrink:0;margin:0}
.pick{text-align:left}
textarea{resize:vertical}
.fld{display:block;margin-bottom:16px}
.fld>span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
.fld small,small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.form{max-width:640px;margin:0 auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inrow{display:flex;gap:8px;align-items:center}
.inrow label{display:flex;gap:6px;align-items:center}
.section{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:16px}
.section h2{font-size:16px;margin:0 0 12px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer}
.cardimg{aspect-ratio:3/4;background:var(--panel2)}
.cardimg img{width:100%;height:100%;object-fit:cover;display:block}
.card.wide .cardimg{aspect-ratio:16/9}
.cardbody{padding:9px 11px 11px}
.ph{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#3b2f6e,#6b2f5e);color:#fff;font-weight:700}
.ph.big{width:100%;height:100%;font-size:48px}
.av{border-radius:50%;object-fit:cover;flex-shrink:0}
.list{display:flex;flex-direction:column;gap:2px}
.row{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;cursor:pointer}
.row:active{background:var(--panel)}
.rowmain{flex:1;min-width:0}
.rowtop{display:flex;justify-content:space-between;gap:8px}
.muted{color:var(--muted)}.sm{font-size:13px}.center{text-align:center}.pad{padding:30px 10px}
.clamp1,.clamp2{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}.clamp1{-webkit-line-clamp:1}.clamp2{-webkit-line-clamp:2}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--panel2);color:var(--muted);margin:2px 2px 0 0}
.search{margin-bottom:12px}
.banner{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:14px;margin-bottom:14px;border:1px solid var(--accent);background:linear-gradient(135deg,rgba(167,139,250,.14),rgba(244,114,182,.10));cursor:pointer}
.empty{text-align:center;padding:48px 16px}
.empty h2{margin:6px 0}
.emptyart{font-size:42px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.empty .btns{justify-content:center}
.avpick{display:flex;flex-direction:column;align-items:center;gap:6px;margin:4px 0 18px;cursor:pointer}
.coverpick{aspect-ratio:16/9;border:1px dashed var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:16px;cursor:pointer;background:var(--panel)}
.coverpick img{width:100%;height:100%;object-fit:cover}
.greet{display:flex;gap:6px;align-items:flex-start;margin-bottom:8px}
.pickrow{display:flex;gap:10px;align-items:center;padding:8px 4px;cursor:pointer}
.entry{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.entry input,.entry textarea{background:var(--bg2)}
.msgs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 10px 6px}
.msg{display:flex;gap:9px;margin-bottom:16px;align-items:flex-start}
.msg.user{flex-direction:row-reverse}
.bub{max-width:84%;background:var(--panel);border-radius:16px;padding:9px 13px 7px;min-width:60px}
.msg.user .bub{background:var(--user)}
.mname{font-size:12px;color:var(--muted);font-weight:650;margin-bottom:2px}
.mtext{overflow-wrap:anywhere}
.mtext em{color:var(--act)}
.mtext .q{color:var(--q)}
.mtools{display:none;gap:2px;align-items:center;margin-top:6px;flex-wrap:wrap}
.msg.sel .mtools,.msg:last-child .mtools{display:flex}
.mtools button{border:0;background:transparent;color:var(--muted);padding:5px 7px;border-radius:8px;display:inline-flex}
.mtools button:active{background:var(--panel2)}
.mtools button:disabled{opacity:.3}
.caret{display:inline-block;width:7px;height:1em;background:var(--accent);margin-left:2px;vertical-align:-2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.speakers{display:flex;gap:6px;overflow-x:auto;padding:6px 10px;align-items:center;border-top:1px solid var(--line);flex-shrink:0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 11px 4px 5px;background:var(--panel);white-space:nowrap;font-size:13px}
.chip.on{border-color:var(--accent);background:rgba(167,139,250,.18)}
.composer{display:flex;gap:8px;align-items:flex-end;padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg2);flex-shrink:0}
.composer textarea{border-radius:20px;resize:none;max-height:160px;padding:10px 14px}
.send{width:44px;height:44px;border-radius:50%;border:0;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#170f2b}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:20}
#modal.open{display:flex}
.sheet{background:var(--bg2);width:100%;max-width:640px;margin:0 auto;max-height:88%;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--line);animation:up .18s ease-out}
.sheet h3{margin:0 0 10px;font-size:18px}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
.sheethead{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.mrow{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:7px}
.mrow.danger{color:var(--danger)}
.mlist{margin-top:8px}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2b2f55;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
.clipbtn{position:relative;height:44px;width:40px}
.badge{position:absolute;top:4px;right:2px;min-width:17px;height:17px;border-radius:9px;background:var(--accent2);color:#170f2b;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
select{appearance:none;-webkit-appearance:none}
</style>
</head>
<body>
<div id="app">
  <header id="top"></header>
  <main id="view"></main>
  <nav id="nav"></nav>
</div>
<div id="modal"></div>
<div id="toast"></div>
<script>
'use strict';
/* ================= Utilities ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const now = () => Date.now();
const est = s => Math.ceil(String(s || '').length / 3.5);
const splitTags = s => String(s || '').split(',').map(t => t.trim()).filter(Boolean);

const IC = {
  chat:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  users:'<circle cx="9" cy="8" r="4"/><path d="M1 21v-1a7 7 0 0 1 14 0v1"/><path d="M16 4a4 4 0 0 1 0 8M23 21v-1a7 7 0 0 0-5-6.7"/>',
  book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/>',
  globe:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/>',
  gear:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  back:'<path d="M15 18l-6-6 6-6"/>',
  left:'<path d="M15 18l-6-6 6-6"/>',
  right:'<path d="M9 18l6-6-6-6"/>',
  send:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>',
  stop:'<rect x="6" y="6" width="12" height="12" rx="2"/>',
  more:'<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>',
  edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
  branch:'<path d="M6 3v12"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>',
  copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  bookmark:'<path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>',
  cont:'<path d="M5 12h14M12 5l7 7-7 7"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
  clip:'<path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>',
  spark:'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/>',
  doc:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>'
};
const ic = (n, s = 20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;

function avatar(src, name, size = 44) {
  const st = `width:${size}px;height:${size}px`;
  if (src) return `<img class="av" style="${st}" src="${src}" alt="">`;
  const ch = (String(name || '?').trim()[0] || '?').toUpperCase();
  return `<div class="av ph" style="${st};font-size:${Math.round(size * .42)}px">${esc(ch)}</div>`;
}
function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), ms); }
function modal(html) { const m = $('#modal'); m.innerHTML = `<div class="sheet">${html}</div>`; m.classList.add('open'); m.onclick = e => { if (e.target === m) closeModal(); }; }
function closeModal() { const m = $('#modal'); m.classList.remove('open'); m.innerHTML = ''; }
function ago(t) { const s = (now() - t) / 1000; if (s < 60) return 'now'; if (s < 3600) return Math.floor(s / 60) + 'm'; if (s < 86400) return Math.floor(s / 3600) + 'h'; if (s < 604800) return Math.floor(s / 86400) + 'd'; return new Date(t).toLocaleDateString(); }
function empty(t, s, btns = '') { return `<div class="empty"><div class="emptyart">✦</div><h2>${t}</h2><p class="muted">${s}</p><div class="btns">${btns}</div></div>`; }
function autoGrow(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 160) + 'px'; }
function pickFile(accept) { return new Promise(res => { const i = document.createElement('input'); i.type = 'file'; i.accept = accept; i.onchange = () => res(i.files[0] || null); i.click(); }); }
function fileToDataURL(f) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); }); }
async function resizeImage(src, max = 512) {
  const img = new Image(); img.src = src; await img.decode();
  const sc = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', .86);
}
function download(name, text, type = 'application/json') {
  const b = new Blob([text], { type }); const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name.replace(/[\\/:*?"<>|]/g, '_');
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000);
}

/* ================= Storage (IndexedDB, on-device) ================= */
const STORES = ['characters', 'stories', 'personas', 'worlds', 'chats', 'instructions', 'kv'];
let _db;
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('lucid', 2);
    r.onupgradeneeded = () => { const db = r.result; STORES.forEach(s => { if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: 'id' }); }); };
    r.onsuccess = () => { _db = r.result; res(_db); }; r.onerror = () => rej(r.error);
  });
}
function req(store, mode, fn) {
  return new Promise((res, rej) => { const t = _db.transaction(store, mode); const r = fn(t.objectStore(store)); t.oncomplete = () => res(r ? r.result : undefined); t.onerror = t.onabort = () => rej(t.error); });
}
const DB = {
  all: s => req(s, 'readonly', st => st.getAll()),
  get: (s, id) => req(s, 'readonly', st => st.get(id)),
  put: (s, o) => req(s, 'readwrite', st => st.put(o)),
  del: (s, id) => req(s, 'readwrite', st => st.delete(id)),
  clear: s => req(s, 'readwrite', st => st.clear())
};
const DATA_STORES = ['characters', 'stories', 'personas', 'worlds', 'chats', 'instructions'];
const S = { characters: {}, stories: {}, personas: {}, worlds: {}, chats: {}, instructions: {}, settings: {} };

const DEFAULT_SYSTEM = `You are {{char}} in an ongoing, immersive roleplay with {{user}}.
- Stay in character at all times. Write {{char}}'s dialogue, actions and inner thoughts in vivid prose.
- Never write {{user}}'s dialogue, actions or decisions; leave room for {{user}} to respond.
- Use *asterisks* for actions and "quotes" for dialogue.
- Keep continuity with the memory, lore and earlier messages.`;
const DEFAULT_NARRATOR = `You are the narrator of an immersive interactive story with {{user}}.
- Describe the world, atmosphere and events in vivid prose, and voice any cast characters the scene needs.
- Never write {{user}}'s dialogue, actions or decisions; end at a point where {{user}} can respond.
- Use *asterisks* for actions and "quotes" for dialogue.
- Keep continuity with the memory, lore and earlier events.`;
const ADULT_RULE = 'Every character in this story is an adult aged 18 or older.';

function defaultSettings() { return { apiKey: '', model: '', temperature: 0.9, maxTokens: 600, contextTokens: 16000, systemTemplate: DEFAULT_SYSTEM, narratorTemplate: DEFAULT_NARRATOR, defaultPersonaId: null, builderModel: '', models: [], modelsFetched: 0 }; }
async function loadAll() {
  for (const s of DATA_STORES) (await DB.all(s)).forEach(o => S[s][o.id] = o);
  const kv = await DB.get('kv', 'settings');
  S.settings = Object.assign(defaultSettings(), kv?.value || {});
}
async function save(store, o) { o.updatedAt = now(); S[store][o.id] = o; await DB.put(store, o); }
async function remove(store, id) { delete S[store][id]; await DB.del(store, id); }
async function saveSettings() { await DB.put('kv', { id: 'settings', value: S.settings }); }
function setS(k, v) { S.settings[k] = v; saveSettings(); }

function newCharacter() { return { id: uid(), name: '', age: '', tagline: '', description: '', personality: '', scenario: '', greetings: [''], examples: '', systemPrompt: '', postHistory: '', tags: [], worldIds: [], instrIds: [], avatar: '', createdAt: now() }; }
function newStory() { return { id: uid(), title: '', cover: '', premise: '', opening: '', characterIds: [], narrator: true, narratorNotes: '', worldIds: [], instrIds: [], tags: [], createdAt: now() }; }
function newInstr() { return { id: uid(), name: '', content: '', enabled: true, scope: 'attached', models: '', position: 'top', createdAt: now() }; }
function newPersona() { return { id: uid(), name: '', description: '', avatar: '', createdAt: now() }; }
function newEntry() { return { id: uid(), keys: '', content: '', enabled: true, constant: false }; }
function newWorld() { return { id: uid(), name: '', entries: [newEntry()], createdAt: now() }; }
const isAdult = c => Number(c?.age) >= 18;

/* ================= Router & shell ================= */
let draft = null;
function go(h) { if (location.hash === h) render(); else location.hash = h; }
function edit(h) { draft = null; closeModal(); go(h); }
function cancelEdit(h) { draft = null; go(h); }
function route() { const [a, b] = (location.hash.slice(2) || 'chats').split('/'); return { a, b }; }
function render() {
  closeModal();
  const { a, b } = route();
  const views = { chats: viewChats, characters: viewCharacters, char: viewCharEdit, stories: viewStories, story: viewStoryEdit, worlds: viewWorlds, world: viewWorldEdit, settings: viewSettings, persona: viewPersonaEdit, chat: viewChat, instr: viewInstrEdit };
  (views[a] || viewChats)(b);
  const map = { char: 'characters', story: 'stories', world: 'worlds', persona: 'settings', instr: 'settings', chat: 'chats' };
  const cur = map[a] || a;
  $$('#nav a').forEach(x => x.classList.toggle('on', x.dataset.n === cur));
}
function shell({ title, back, actions = '', body, nav = true, cls = '' }) {
  $('#top').innerHTML = `${back ? `<button class="icon" onclick="${back}" aria-label="Back">${ic('back', 22)}</button>` : ''}<h1>${esc(title)}</h1><div class="acts">${actions}</div>`;
  const v = $('#view'); v.className = cls; v.innerHTML = body; v.scrollTop = 0;
  document.body.classList.toggle('nonav', !nav);
}
function buildNav() {
  const items = [['chats', 'chat', 'Chats'], ['characters', 'users', 'Characters'], ['stories', 'book', 'Stories'], ['worlds', 'globe', 'Worlds'], ['settings', 'gear', 'Settings']];
  $('#nav').innerHTML = items.map(([n, i, l]) => `<a data-n="${n}" href="#/${n}" onclick="draft=null">${ic(i, 22)}<span>${l}</span></a>`).join('');
}

/* ================= Form helpers ================= */
function field(label, key, val, o = {}) {
  return `<label class="fld"><span>${label}${o.req ? ' *' : ''}</span><input data-k="${key}" type="${o.type || 'text'}" value="${esc(val ?? '')}" placeholder="${esc(o.ph || '')}" ${o.type === 'number' ? 'inputmode="numeric"' : ''}>${o.hint ? `<small>${o.hint}</small>` : ''}</label>`;
}
function area(label, key, val, o = {}) {
  return `<label class="fld"><span>${label}</span><textarea data-k="${key}" rows="${o.rows || 4}" placeholder="${esc(o.ph || '')}">${esc(val ?? '')}</textarea>${o.hint ? `<small>${o.hint}</small>` : ''}</label>`;
}
function readForm(d) {
  $$('#view [data-k]').forEach(el => {
    if (el.type === 'radio') { if (el.checked) d[el.dataset.k] = el.value; }
    else if (el.type === 'checkbox') d[el.dataset.k] = el.checked;
    else if (el.type === 'number') d[el.dataset.k] = el.value === '' ? '' : Number(el.value);
    else d[el.dataset.k] = el.value;
  });
}
function worldPicker(ids) {
  const ws = Object.values(S.worlds);
  return `<div class="fld"><span>World Books</span>${ws.length ? ws.map(w => `<label class="pickrow"><input type="checkbox" data-w="${w.id}" ${(ids || []).includes(w.id) ? 'checked' : ''}><span>${esc(w.name)} <small style="display:inline">· ${w.entries.length} entries</small></span></label>`).join('') : '<small>No World Books yet. Create them in the Worlds tab.</small>'}</div>`;
}
const readWorlds = () => $$('[data-w]:checked').map(e => e.dataset.w);
function instrPicker(ids) {
  const ds = Object.values(S.instructions).filter(d => d.scope === 'attached').sort((a, b) => a.createdAt - b.createdAt);
  return `<div class="fld"><span>Instructions</span>${ds.length ? ds.map(d => `<label class="pickrow"><input type="checkbox" data-ins="${d.id}" ${(ids || []).includes(d.id) ? 'checked' : ''}><span>${esc(d.name)} <small style="display:inline">· ~${est(d.content).toLocaleString()} tokens</small></span></label>`).join('') : '<small>Instruction docs set to "only where attached" (Settings → Instructions) show up here.</small>'}</div>`;
}
const readInstr = () => $$('[data-ins]:checked').map(e => e.dataset.ins);

/* ================= Chats list ================= */
function chatMeta(c) {
  if (c.type === 'story') { const st = S.stories[c.storyId]; return { name: c.title, avatar: st?.cover || S.characters[c.characterIds?.[0]]?.avatar }; }
  return { name: c.title, avatar: S.characters[c.charId]?.avatar };
}
function viewChats() {
  const chats = Object.values(S.chats).sort((a, b) => b.updatedAt - a.updatedAt);
  const st = S.settings;
  const todo = [];
  if (!st.apiKey) todo.push('add your OpenRouter key');
  if (!st.model) todo.push('pick a model');
  if (!Object.keys(S.personas).length) todo.push('create a persona');
  const banner = todo.length ? `<div class="banner" onclick="go('#/settings')"><b>Finish setup</b><span class="sm">In Settings: ${todo.join(', ')}.</span></div>` : '';
  shell({
    title: 'Chats',
    body: banner + (chats.length ? `<div class="list">${chats.map(chatRow).join('')}</div>` :
      empty('No chats yet', 'Start one from a character or a story.', `<button class="btn" onclick="go('#/characters')">Characters</button><button class="btn ghost" onclick="go('#/stories')">Stories</button>`))
  });
}
function chatRow(c) {
  const m = chatMeta(c); const last = c.messages[c.messages.length - 1];
  const txt = last ? macroFor(c, last, msgText(last)) : '';
  return `<div class="row" onclick="go('#/chat/${c.id}')">${avatar(m.avatar, m.name, 50)}<div class="rowmain"><div class="rowtop"><b class="clamp1">${esc(m.name)}</b><span class="muted sm">${ago(c.updatedAt)}</span></div><div class="muted sm clamp2">${esc(txt.slice(0, 160))}</div></div></div>`;
}

function syncChar() { readForm(draft); draft.greetings = $$('[data-g]').map(e => e.value); draft.worldIds = readWorlds(); draft.instrIds = readInstr(); }
function addGreeting() { syncChar(); draft.greetings.push(''); const y = $('#view').scrollTop; viewCharEdit(draft._for); $('#view').scrollTop = y; }
function removeGreeting(i) { syncChar(); draft.greetings.splice(i, 1); const y = $('#view').scrollTop; viewCharEdit(draft._for); $('#view').scrollTop = y; }
async function pickCharAvatar() {
  syncChar(); const f = await pickFile('image/*'); if (!f) return;
  try { draft.avatar = await resizeImage(await fileToDataURL(f), 640); viewCharEdit(draft._for); } catch (e) { toast('Could not read that image'); }
}
async function saveChar() {
  syncChar(); const d = draft;
  d.greetings = d.greetings.filter(s => s.trim());
  if (!d.name.trim()) return toast('Name is required');
  if (!isAdult(d)) return toast('Characters must be 18 or older. Set an age of 18+.', 3500);
  d.tags = splitTags(d.tagsStr);
  if (d._world) { await save('worlds', d._world); if (!d.worldIds.includes(d._world.id)) d.worldIds.push(d._world.id); }
  const o = { ...d }; for (const k of ['_for', 'tagsStr', '_world', '_undo', '_changed']) delete o[k];
  await save('characters', o); draft = null; toast('Saved'); go('#/characters');
}
async function dupChar(id) { const c = structuredClone(S.characters[id]); c.id = uid(); c.name += ' (copy)'; c.createdAt = now(); await save('characters', c); toast('Duplicated'); go('#/characters'); }
async function deleteChar(id) {
  const n = Object.values(S.chats).filter(x => x.charId === id).length;
  if (!confirm(`Delete ${S.characters[id].name}?${n ? ` ${n} chat(s) with them will remain but lose the profile.` : ''}`)) return;
  await remove('characters', id); closeModal(); toast('Deleted'); render();
}

/* ---- Card import / export (Tavern V1/V2, Chub, V3 PNG) ---- */
function readPngCard(buf) {
  const dv = new DataView(buf), u8 = new Uint8Array(buf), dec = new TextDecoder('latin1'), found = {};
  if (dv.getUint32(0) !== 0x89504e47) throw new Error('Not a PNG file');
  let p = 8;
  while (p + 8 <= u8.length) {
    const len = dv.getUint32(p), type = dec.decode(u8.subarray(p + 4, p + 8)), data = u8.subarray(p + 8, p + 8 + len);
    if (type === 'tEXt') { const z = data.indexOf(0); found[dec.decode(data.subarray(0, z)).toLowerCase()] = dec.decode(data.subarray(z + 1)); }
    if (type === 'IEND') break;
    p += 12 + len;
  }
  const b64 = found.ccv3 || found.chara;
  if (!b64) throw new Error('No character data found in this PNG');
  const bin = atob(b64.trim()); const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(bytes));
}
function cardToCharacter(card) {
  const d = card.data || card, c = newCharacter();
  c.name = d.name || d.char_name || 'Imported character';
  c.description = d.description || d.char_persona || '';
  c.personality = d.personality || '';
  c.scenario = d.scenario || d.world_scenario || '';
  c.greetings = [d.first_mes || d.char_greeting, ...(d.alternate_greetings || [])].filter(Boolean);
  if (!c.greetings.length) c.greetings = [''];
  c.examples = d.mes_example || d.example_dialogue || '';
  c.systemPrompt = d.system_prompt || '';
  c.postHistory = d.post_history_instructions || '';
  c.tags = Array.isArray(d.tags) ? d.tags.map(String) : [];
  c.tagline = d.creator_notes ? String(d.creator_notes).split('\n').find(l => l.trim())?.slice(0, 140) || '' : '';
  const ext = d.extensions?.lucid; if (ext) { c.age = ext.age ?? ''; c.avatar = ext.avatar || ''; c.tagline = ext.tagline ?? c.tagline; }
  const book = d.character_book;
  if (book?.entries?.length) {
    c._world = { id: uid(), name: book.name || `${c.name} lore`, createdAt: now(),
      entries: book.entries.map(e => ({ id: uid(), keys: (e.keys || []).join(', '), content: e.content || '', enabled: e.enabled !== false, constant: !!e.constant })) };
  }
  return c;
}
async function importCharacter() {
  const f = await pickFile('.png,.json,image/png,application/json'); if (!f) return;
  try {
    let card, av = null;
    if (f.type === 'image/png' || /\.png$/i.test(f.name)) { card = readPngCard(await f.arrayBuffer()); av = await resizeImage(await fileToDataURL(f), 640); }
    else card = JSON.parse(await f.text());
    const c = cardToCharacter(card); if (av) c.avatar = av;
    draft = c; draft._for = 'new';
    toast(c._world ? 'Imported with lore book. Check the age, then save.' : 'Imported. Check the age, then save.', 3500);
    go('#/char/new');
  } catch (e) { toast('Could not import: ' + e.message, 4000); }
}
function exportCharacter(id) {
  const c = S.characters[id];
  const card = { spec: 'chara_card_v2', spec_version: '2.0', data: {
    name: c.name, description: c.description, personality: c.personality, scenario: c.scenario,
    first_mes: c.greetings[0] || '', alternate_greetings: c.greetings.slice(1), mes_example: c.examples,
    system_prompt: c.systemPrompt, post_history_instructions: c.postHistory, tags: c.tags, creator_notes: c.tagline,
    character_book: (c.worldIds || []).length ? { name: `${c.name} lore`, entries: c.worldIds.flatMap(w => S.worlds[w]?.entries || []).map((e, i) => ({ id: i, keys: splitTags(e.keys), content: e.content, enabled: e.enabled, constant: e.constant, insertion_order: i })) } : undefined,
    extensions: { lucid: { age: c.age, avatar: c.avatar, tagline: c.tagline } } } };
  download(`${c.name}.json`, JSON.stringify(card, null, 2));
}

function syncStory() { readForm(draft); draft.characterIds = $$('[data-cast]:checked').map(e => e.dataset.cast); draft.worldIds = readWorlds(); draft.instrIds = readInstr(); }
async function pickCover() {
  syncStory(); const f = await pickFile('image/*'); if (!f) return;
  try { draft.cover = await resizeImage(await fileToDataURL(f), 960); viewStoryEdit(draft._for); } catch (e) { toast('Could not read that image'); }
}
async function saveStory() {
  syncStory(); const d = draft;
  if (!d.title.trim()) return toast('Title is required');
  if (d.characterIds.length > 5) return toast('Up to 5 cast members');
  if (!d.characterIds.length && !d.narrator) return toast('Add at least one cast member or turn on the narrator');

  for (const c of d._newChars || []) if (d.characterIds.includes(c.id)) await save('characters', c);
  const o = { ...d }; for (const k of ['_for', 'tagsStr', '_newChars', '_undo', '_changed']) delete o[k];
  await save('stories', o); draft = null; toast('Saved'); go('#/stories');

async function deleteStory(id) { if (!confirm('Delete this story? Existing chats remain.')) return; await remove('stories', id); closeModal(); toast('Deleted'); go('#/stories'); }

/* ================= Prompt building ================= */
function charBlock(ch, M, full) {
  if (!ch) return '';
  const L = [full ? `# ${ch.name}` : `## ${ch.name}`];
  if (ch.age) L.push(`Age: ${ch.age}`);
  if (ch.description) L.push(`Description:\n${M(ch.description)}`);
  if (ch.personality) L.push(`Personality: ${M(ch.personality)}`);
  if (full && ch.scenario) L.push(`# Scenario\n${M(ch.scenario)}`);
  if (full && ch.examples) L.push(`# Example dialogue (style reference only, not part of the story)\n${M(ch.examples)}`);
  return L.join('\n');
}
function matchLore(c, history) {
  const ids = new Set(c.worldIds || []);
  if (c.type === 'char') (S.characters[c.charId]?.worldIds || []).forEach(i => ids.add(i));
  else { (S.stories[c.storyId]?.worldIds || []).forEach(i => ids.add(i)); (c.characterIds || []).forEach(id => (S.characters[id]?.worldIds || []).forEach(i => ids.add(i))); }
  const scan = history.slice(-6).map(msgText).join('\n').toLowerCase();
  const out = [];
  for (const wid of ids) {
    const w = S.worlds[wid]; if (!w) continue;
    for (const e of w.entries || []) {
      if (!e.enabled || !e.content.trim()) continue;
      const keys = splitTags(e.keys).map(k => k.toLowerCase());
      if (e.constant || keys.some(k => scan.includes(k))) out.push(e.content);
    }
  }
  return out;
}
function mergeRoles(arr) { const out = []; for (const m of arr) { const l = out[out.length - 1]; if (l && l.role === m.role && m.role !== 'system') l.content += '\n\n' + m.content; else out.push({ ...m }); } return out; }
function buildPrompt(c, history, speakerId, contMsg) {
  const st = S.settings, n = names(c, speakerId), p = S.personas[c.personaId];
  const M = t => macro(t, n.char, n.user);
  const parts = []; let ch = null;
  if (c.type === 'char') {
    ch = S.characters[c.charId];
    parts.push(M(ch?.systemPrompt?.trim() ? ch.systemPrompt : st.systemTemplate));
    parts.push(charBlock(ch, M, true));
  } else {
    const story = S.stories[c.storyId] || {};
    if (speakerId === 'narrator') parts.push(M(st.narratorTemplate || DEFAULT_NARRATOR));
    else {
      ch = S.characters[speakerId];
      parts.push(M(ch?.systemPrompt?.trim() ? ch.systemPrompt : st.systemTemplate));
      parts.push(M('This is a group story. In this reply, write ONLY as {{char}}. Other cast members may be present, but do not write their dialogue or actions.'));
    }
    if (story.premise) parts.push(`# Story setting\n${M(story.premise)}`);
    if (speakerId === 'narrator' && story.narratorNotes) parts.push(`# Narration style\n${M(story.narratorNotes)}`);
    const cast = (c.characterIds || []).map(id => S.characters[id]).filter(Boolean);
    if (cast.length) parts.push('# Cast\n' + cast.map(x => charBlock(x, t => macro(t, x.name, n.user), false)).join('\n\n'));
    if (ch?.examples) parts.push(`# Example dialogue for ${ch.name} (style reference only)\n${macro(ch.examples, ch.name, n.user)}`);
  }
  const instr = activeInstructions(c, speakerId);
  const top = instr.filter(x => x.position !== 'bottom'), bottom = instr.filter(x => x.position === 'bottom');
  if (top.length) parts.splice(1, 0, ...top.map(x => `# Instructions: ${x.name}\n${M(x.content)}`));
  if (p?.description) parts.push(`# About ${n.user} (played by the user)\n${M(p.description)}`);
  const lore = matchLore(c, history); if (lore.length) parts.push('# Lore\n' + lore.map(M).join('\n\n'));
  if (c.memory?.trim()) parts.push(`# Memory (key facts and the story so far)\n${M(c.memory)}`);
  parts.push(ADULT_RULE);
  const system = parts.filter(Boolean).join('\n\n');

  const group = c.type === 'story';
  const msgs = history.map(m => {
    const txt = macroFor(c, m, msgText(m));
    if (m.role === 'user') return { role: 'user', content: group ? `${n.user}: ${txt}` : txt };
    const sid = m.charId || m.speaker;
    if (!group || sid === speakerId) return { role: 'assistant', content: txt };

  const tailExtra = [];
  if (contMsg) tailExtra.push({ role: 'assistant', content: macroFor(c, contMsg, msgText(contMsg)) }, { role: 'user', content: '[Continue your previous reply from exactly where it stopped. Do not repeat anything already written.]' });
  const post = [];
  if (ch?.postHistory?.trim()) post.push(M(ch.postHistory));
  bottom.forEach(x => post.push(M(x.content)));
  if (group && !contMsg) post.push(speakerId === 'narrator' ? "[Write the narrator's next passage.]" : `[Write ${n.char}'s next reply only.]`);

  let budget = Number(st.contextTokens || 16000) - Number(st.maxTokens || 600) - est(system) - est(post.join('')) - est(tailExtra.map(x => x.content).join('')) - 200;
  const kept = [];
  for (let i = msgs.length - 1; i >= 0; i--) { const t = est(msgs[i].content) + 4; if (budget - t < 0 && kept.length) break; budget -= t; kept.unshift(msgs[i]); }
  let convo = mergeRoles([...kept, ...tailExtra]);
  if (!convo.length || convo[0].role !== 'user') convo.unshift({ role: 'user', content: '[The roleplay begins.]' });
  if (post.length) convo.push({ role: 'system', content: post.join('\n') });
  c._ctx = { used: kept.length, total: msgs.length, tokens: Number(st.contextTokens) - budget - Number(st.maxTokens) };
  return [{ role: 'system', content: system }, ...convo];
}

async function streamChat(messages, signal, onDelta, opts = {}) {
  const st = S.settings;
  const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
    method: 'POST', signal,
    headers: { 'Authorization': 'Bearer ' + st.apiKey, 'Content-Type': 'application/json', 'HTTP-Referer': (location.origin && location.origin !== 'null') ? location.origin : 'https://lucid.local', 'X-Title': 'Lucid' },
    body: JSON.stringify({ model: opts.model || st.model, messages, stream: true, temperature: Number(st.temperature), max_tokens: Number(opts.maxTokens || st.maxTokens) })
  });
  if (!res.ok) {
    let msg = `${res.status} ${res.statusText}`;
    try { const j = await res.json(); msg = j.error?.message || msg; } catch (e) {}
    throw new Error('OpenRouter: ' + msg);
  }
  const reader = res.body.getReader(), dec = new TextDecoder(); let buf = '';
  while (true) {
    const { done, value } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    let nl;
    while ((nl = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
      if (!line.startsWith('data:')) continue;
      const data = line.slice(5).trim(); if (data === '[DONE]') return;
      let j; try { j = JSON.parse(data); } catch (e) { continue; }
      if (j.error) throw new Error('OpenRouter: ' + (j.error.message || 'stream error'));
      const d = j.choices?.[0]?.delta?.content; if (d) onDelta(d);
    }
  }
}

  const speakerId = m.charId || m.speaker;
  const payload = buildPrompt(c, history, speakerId, mode === 'continue' ? m : null);
  const ctrl = new AbortController();
  gen = { chatId: c.id, ctrl, msgId: m.id };
  if (isViewing(c.id)) { renderMsgs(c); updateSendBtn(); scrollBottom(); }
  let out = '';
  const join = () => (base && out && !/\s$/.test(base) && !/^[\s.,!?;:'"”)\]—-]/.test(out)) ? ' ' : '';
  try {
    await streamChat(payload, ctrl.signal, d => { out += d; m.swipes[m.swipeIdx] = base + join() + out; paintMsg(c, m); }, { model: c.model || S.settings.model });
  } catch (e) {

  }
  if (!out.trim()) {
    if (mode === 'new') c.messages.splice(c.messages.indexOf(m), 1);
    else if (mode === 'swipe') { m.swipes.pop(); m.swipeIdx = m.swipes.length - 1; }
    else m.swipes[m.swipeIdx] = base;
  } else if (mode !== 'continue') {
    m.swipes[m.swipeIdx] = cleanReply(m.swipes[m.swipeIdx], speakerInfo(c, m).name);
  }

  if (isViewing(c.id)) { renderMsgs(c); updateSendBtn(); }
}

}

}

function aiFail(e) {
  if (e.message === 'setup') return;
  const msg = e.name === 'AbortError' ? 'Cancelled.' : e.message, s = $('#bstat');
  if (s) s.textContent = msg; else toast(msg, 5000);
}
const builderModelName = () => esc(S.settings.builderModel || S.settings.model || 'your default model');
function builderButtons(fn, label) { return `<div class="sm muted" id="bstat" style="margin-top:8px">Uses ${builderModelName()}.</div><div class="btns"><button class="btn" id="bgo" onclick="${fn}()">${label}</button><button class="btn ghost" id="bcancel" style="display:none" onclick="aiCancel()">Cancel</button></div>`; }
function aiBar(d, kind) {
  if (!d._changed) return '';
  return `<div class="banner" style="cursor:default"><b>${ic('spark', 14)} AI changed: ${d._changed.map(esc).join(', ')}</b><div class="btns" style="margin:6px 0 0"><button class="btn ghost sm" onclick="undoAI('${kind}')">Undo</button><button class="btn ghost sm" onclick="keepAI('${kind}')">Keep</button></div></div>`;
}
const aiSync = kind => kind === 'char' ? syncChar() : syncStory();
const aiRerender = kind => kind === 'char' ? viewCharEdit(draft._for) : viewStoryEdit(draft._for);
function undoAI(kind) { const u = draft._undo; if (!u) return; draft = u; draft._undo = null; draft._changed = null; aiRerender(kind); toast('Undone'); }
function keepAI(kind) { aiSync(kind); draft._undo = null; draft._changed = null; aiRerender(kind); }
function applyPatch(kind, patch, cur) {
  const keys = Object.keys(patch).filter(k => JSON.stringify(patch[k]) !== JSON.stringify(cur[k]));
  if (!keys.length) return false;
  const snap = structuredClone({ ...draft, _undo: null, _changed: null });
  for (const k of keys) draft[k] = patch[k];
  if (keys.includes('tags')) draft.tagsStr = draft.tags.join(', ');
  if (keys.includes('greetings') && !draft.greetings.length) draft.greetings = [''];
  draft._undo = snap; draft._changed = keys;
  closeModal(); aiRerender(kind); $('#view').scrollTop = 0;
  return true;
}
function quickChips(list) { return `<div class="btns">${list.map(s => `<button class="chip" style="padding:5px 11px" onclick="$('#bidea').value=this.textContent">${s}</button>`).join('')}</div>`; }

function charBuilder() {
  modal(`<h3>${ic('spark', 18)} Build a character</h3><p class="sm muted">Describe the idea. The AI drafts every field, then you review and edit before saving.</p>
    <textarea id="bidea" rows="6" placeholder="Who they are, where they live, how they talk, their dynamic with you, genre and tone…"></textarea>
    <div class="two" style="margin-top:10px"><label class="fld"><span>Greetings</span><select id="bgreet"><option>1</option><option selected>2</option><option>3</option></select></label><label class="fld"><span>Detail</span><select id="bdetail"><option value="concise">Concise</option><option value="rich" selected>Rich</option></select></label></div>
    ${builderButtons('runCharBuilder', 'Generate')}`);
}
async function runCharBuilder() {
  const idea = $('#bidea').value.trim(); if (!idea) return toast('Describe the character first');
  const n = $('#bgreet').value, detail = $('#bdetail').value;
  aiBusy(true);
  try {
    const o = await aiRun([
      { role: 'system', content: `You are a character designer for an interactive roleplay app. ${BUILDER_RULES}` },
      { role: 'user', content: `Create a character from this idea:\n${idea}\n\nWrite exactly ${n} greeting(s). Detail level: ${detail}.\nUse exactly this JSON format:\n${CHAR_SCHEMA}` }], $('#bstat'));
    if (isMinorAge(o.age)) throw new Error(MINOR_MSG);
    const c = Object.assign(newCharacter(), normChar(o));
    if (!c.greetings.length) c.greetings = [''];
    draft = c; draft._for = 'new'; go('#/char/new');
    toast(c.age ? 'Draft ready. Review it, then save.' : 'Draft ready. Set an age (18+), then save.', 3500);
  } catch (e) { aiFail(e); aiBusy(false); }
}
function charFields(d) {
  return { name: d.name, age: d.age, tagline: d.tagline, description: d.description, personality: d.personality, scenario: d.scenario,
    greetings: (d.greetings || []).filter(g => g.trim()), examples: d.examples, tags: splitTags(d.tagsStr ?? (d.tags || []).join(',')) };
}
function charAssist() {
  syncChar();
  modal(`<h3>${ic('spark', 18)} AI assist</h3><p class="sm muted">Say what to change. You can undo it afterwards. Unsaved edits are included.</p>
    ${quickChips(['Write 2 more alternate greetings', 'Expand the description', 'Make the personality more distinctive', 'Write example dialogue', 'Fill in any empty fields'])}
    <textarea id="bidea" rows="4" placeholder="e.g. Give them a secret and a sharper sense of humor"></textarea>
    ${builderButtons('runCharAssist', 'Apply')}`);
}
async function runCharAssist() {
  const want = $('#bidea').value.trim(); if (!want) return toast('Say what to change');
  const cur = charFields(draft);
  aiBusy(true);
  try {
    const o = await aiRun([
      { role: 'system', content: `You are a character designer for an interactive roleplay app, editing an existing character. ${BUILDER_RULES}` },
      { role: 'user', content: `Current character:\n${JSON.stringify(cur, null, 2)}\n\nChange request: ${want}\n\nReturn a JSON object containing ONLY the fields you changed, using the same field names. If you change greetings, return the complete updated array. Field format reference:\n${CHAR_SCHEMA}` }], $('#bstat'));
    if (isMinorAge(o.age)) throw new Error(MINOR_MSG);
    if (!applyPatch('char', normChar(o), cur)) { $('#bstat').textContent = 'No changes came back. Try rewording.'; aiBusy(false); }
  } catch (e) { aiFail(e); aiBusy(false); }
}
function storyBuilder() {
  const chars = Object.values(S.characters).sort((a, b) => a.name.localeCompare(b.name));
  modal(`<h3>${ic('spark', 18)} Build a story</h3><p class="sm muted">Describe the scenario. Use existing characters, let the AI invent new ones, or both. You review everything before saving.</p>
    <textarea id="bidea" rows="6" placeholder="Setting, situation, stakes, genre, tone, and who you are in it…"></textarea>
    ${chars.length ? `<div class="fld" style="margin-top:10px"><span>Existing characters in the cast</span>${chars.map(c => `<label class="pickrow"><input type="checkbox" data-bcast="${c.id}">${avatar(c.avatar, c.name, 28)}<span>${esc(c.name)}</span></label>`).join('')}</div>` : ''}
    <div class="two" style="margin-top:10px"><label class="fld"><span>New characters to invent</span><select id="bnew">${[0, 1, 2, 3].map(n => `<option ${n === (chars.length ? 0 : 2) ? 'selected' : ''}>${n}</option>`).join('')}</select></label><label class="fld"><span>Narrator</span><select id="bnarr"><option value="yes">On</option><option value="no">Off</option></select></label></div>
    ${builderButtons('runStoryBuilder', 'Generate')}`);
}
async function runStoryBuilder() {
  const idea = $('#bidea').value.trim(); if (!idea) return toast('Describe the story first');
  const castIds = $$('[data-bcast]:checked').map(e => e.dataset.bcast), nNew = Number($('#bnew').value), narr = $('#bnarr').value === 'yes';
  if (castIds.length + nNew > 5) return toast('The cast is limited to 5 characters');
  if (!castIds.length && !nNew && !narr) return toast('Pick a cast, invent characters, or turn on the narrator');
  const castInfo = castIds.map(id => { const c = S.characters[id]; return `- ${c.name}: ${(c.tagline || c.description || '').slice(0, 300)}`; }).join('\n');
  aiBusy(true);
  try {
    const o = await aiRun([
      { role: 'system', content: `You are a story designer for an interactive roleplay app. ${BUILDER_RULES}` },
      { role: 'user', content: `Create a story scenario from this idea:\n${idea}\n\n${castInfo ? `Existing cast to include (do not redefine them, just use them):\n${castInfo}\n\n` : ''}${nNew ? `Invent exactly ${nNew} new character(s) and put them in "newCharacters", each as an object in this format:\n${CHAR_SCHEMA}\n\n` : 'Leave "newCharacters" as an empty array.\n\n'}${narr ? 'A narrator delivers the opening scene.' : 'There is no narrator: write the opening as a plain scene description.'}\n\nUse exactly this JSON format:\n${STORY_SCHEMA}` }], $('#bstat'));
    const s = Object.assign(newStory(), normStory(o)); s.narrator = narr;
    const raw = Array.isArray(o.newCharacters) ? o.newCharacters : [];
    const dropped = raw.filter(x => isMinorAge(x?.age)).length;
    const newChars = raw.filter(x => !isMinorAge(x?.age)).slice(0, 5 - castIds.length).map(x => {
      const c = Object.assign(newCharacter(), normChar(x || {})); if (!c.greetings.length) c.greetings = ['']; if (!c.name) c.name = 'Unnamed'; return c; });
    s.characterIds = [...castIds, ...newChars.map(c => c.id)];
    draft = s; draft._for = 'new'; draft._newChars = newChars; go('#/story/new');
    toast((newChars.length ? `Draft ready with ${newChars.length} new character(s). Review, then save.` : 'Draft ready. Review it, then save.') + (dropped ? ` ${dropped} under-18 character(s) the model wrote were discarded.` : ''), 4500);
  } catch (e) { aiFail(e); aiBusy(false); }
}
function storyAssist() {
  syncStory();
  modal(`<h3>${ic('spark', 18)} AI assist</h3><p class="sm muted">Say what to change in the story. You can undo it afterwards.</p>
    ${quickChips(['Raise the stakes', 'Rewrite the opening with more tension', 'Expand the setting', 'Suggest a narration style'])}
    <textarea id="bidea" rows="4" placeholder="e.g. Move it to a snowed-in mountain lodge"></textarea>
    ${builderButtons('runStoryAssist', 'Apply')}`);
}
async function runStoryAssist() {
  const want = $('#bidea').value.trim(); if (!want) return toast('Say what to change');
  const d = draft, cur = { title: d.title, premise: d.premise, opening: d.opening, narratorNotes: d.narratorNotes, tags: splitTags(d.tagsStr ?? (d.tags || []).join(',')) };
  const cast = [...Object.values(S.characters), ...(d._newChars || [])].filter(c => (d.characterIds || []).includes(c.id)).map(c => `- ${c.name}: ${(c.tagline || '').slice(0, 200)}`).join('\n');
  aiBusy(true);
  try {
    const o = await aiRun([
      { role: 'system', content: `You are a story designer for an interactive roleplay app, editing an existing scenario. ${BUILDER_RULES}` },
      { role: 'user', content: `Current story:\n${JSON.stringify(cur, null, 2)}\n${cast ? `\nCast:\n${cast}\n` : ''}\nChange request: ${want}\n\nReturn a JSON object containing ONLY the fields you changed (title, premise, opening, narratorNotes, tags).` }], $('#bstat'));
    if (!applyPatch('story', normStory(o), cur)) { $('#bstat').textContent = 'No changes came back. Try rewording.'; aiBusy(false); }
  } catch (e) { aiFail(e); aiBusy(false); }
}

/* ================= Settings ================= */
function num(label, key, val, min, max, step, hint = '') {
  return `<label class="fld"><span>${label}</span><input type="number" inputmode="decimal" value="${esc(val)}" min="${min}" max="${max}" step="${step}" onchange="setS('${key}', Number(this.value))">${hint ? `<small>${hint}</small>` : ''}</label>`;
}
function viewSettings() {
  const st = S.settings, ps = Object.values(S.personas);
  shell({
    title: 'Settings',
    body: `<div class="form">
    <div class="section"><h2>OpenRouter</h2>
      <label class="fld"><span>API key</span><div class="inrow"><input id="key" type="password" autocomplete="off" value="${esc(st.apiKey)}" placeholder="sk-or-…" onchange="setS('apiKey', this.value.trim())"><button class="btn ghost sm" onclick="const k=$('#key');k.type=k.type==='password'?'text':'password'">Show</button></div>
        <small>Stored only in this browser and never included in backups. Get one at <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">openrouter.ai/keys</a>.</small></label>
      <div class="fld"><span>Default model</span><button class="pick" onclick="modelPicker(m => { setS('model', m); viewSettings(); })">${esc(st.model || 'Choose a model…')}</button></div>
      <div class="fld"><span>Builder model</span><button class="pick" onclick="modelPicker(m => { setS('builderModel', m); viewSettings(); })">${esc(st.builderModel || 'Same as default model')}</button><small>Used by the AI character & story builder. Pick one that follows JSON instructions reliably.${st.builderModel ? ` <a href="#" onclick="event.preventDefault();setS('builderModel','');viewSettings()">Use default</a>` : ''}</small></div>
      <div class="two">${num('Temperature', 'temperature', st.temperature, 0, 2, 0.05)}${num('Max reply tokens', 'maxTokens', st.maxTokens, 50, 8000, 10)}</div>
      ${num('Context budget (tokens)', 'contextTokens', st.contextTokens, 2000, 2000000, 1000, 'How much prompt + history to send each turn. Higher remembers more but costs more per message. Keep it under the model\'s context size.')}
    </div>
    <div class="section"><h2>Personas <span class="muted sm">· who you play</span></h2>
      ${ps.map(p => `<div class="row" onclick="edit('#/persona/${p.id}')">${avatar(p.avatar, p.name, 40)}<div class="rowmain"><b>${esc(p.name)}</b>${st.defaultPersonaId === p.id ? ' <span class="tag">default</span>' : ''}<div class="muted sm clamp1">${esc(p.description || '')}</div></div></div>`).join('')}
      <button class="btn ghost sm" onclick="edit('#/persona/new')">${ic('plus', 14)} Add persona</button>
    </div>
    <div class="section"><h2>Instructions <span class="muted sm">· .md files sent to the model</span></h2>
      ${Object.values(S.instructions).sort((a, b) => a.createdAt - b.createdAt).map(d => `<div class="row" onclick="edit('#/instr/${d.id}')"><div class="av ph" style="width:40px;height:40px">${ic('doc', 18)}</div><div class="rowmain"><b>${esc(d.name)}</b>${d.enabled ? '' : ' <span class="tag">off</span>'}<div class="muted sm clamp1">${esc(scopeLabel(d))} · ~${est(d.content).toLocaleString()} tokens</div></div></div>`).join('') || '<p class="sm muted">None yet. Use these for writing-style rules, formatting, or model-specific fixes.</p>'}
      <div class="btns"><button class="btn ghost sm" onclick="edit('#/instr/new')">${ic('plus', 14)} New</button><button class="btn ghost sm" onclick="importInstrFile()">${ic('doc', 14)} Import .md</button></div>
    </div>
    <div class="section"><h2>Prompts</h2>
      <label class="fld"><span>Character system prompt</span><textarea rows="7" onchange="setS('systemTemplate', this.value)">${esc(st.systemTemplate)}</textarea></label>
      <label class="fld"><span>Narrator system prompt</span><textarea rows="6" onchange="setS('narratorTemplate', this.value)">${esc(st.narratorTemplate)}</textarea><small>{{char}} and {{user}} are replaced automatically. An adults-only line is always added.</small></label>
      <button class="btn ghost sm" onclick="resetPrompts()">Reset to defaults</button>
    </div>
    <div class="section"><h2>Data</h2>
      <p class="sm muted" id="storinfo">Everything lives on this device. Export a backup regularly; Safari can clear data for web apps that aren't on your home screen.</p>
      <div class="btns"><button class="btn ghost" onclick="exportBackup()">Export backup</button><button class="btn ghost" onclick="importBackup()">Import backup</button></div>
      <button class="btn danger sm" onclick="wipeAll()">Delete all data</button>
    </div>
    <p class="center sm muted">Lucid v2</p></div>`
  });
  storageInfo();
}
async function storageInfo() {
  try {
    const persisted = await navigator.storage?.persisted?.();
    const e = await navigator.storage?.estimate?.();
    const el = $('#storinfo');
    if (el && e) el.textContent += ` Using ${(e.usage / 1048576).toFixed(1)} MB.${persisted ? ' Storage is marked persistent.' : ''}`;
  } catch (err) {}
}
function resetPrompts() { if (!confirm('Reset both prompts to the defaults?')) return; S.settings.systemTemplate = DEFAULT_SYSTEM; S.settings.narratorTemplate = DEFAULT_NARRATOR; saveSettings(); viewSettings(); toast('Prompts reset'); }
function exportBackup() {
  const { apiKey, models, modelsFetched, ...settings } = S.settings;
  const data = { app: 'lucid', version: 1, exported: new Date().toISOString(), settings,
    ...Object.fromEntries(DATA_STORES.map(s => [s, Object.values(S[s])])) };
  download(`lucid-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(data));
}
async function importBackup() {
  const f = await pickFile('.json,application/json'); if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (data.app !== 'lucid') throw new Error('Not a Lucid backup');
    if (!confirm('Merge this backup into your current data? Items with the same ID are overwritten.')) return;
    for (const s of DATA_STORES) for (const o of data[s] || []) { S[s][o.id] = o; await DB.put(s, o); }
    if (data.settings) { const { apiKey, ...rest } = data.settings; Object.assign(S.settings, rest); await saveSettings(); }
    toast('Backup imported'); render();
  } catch (e) { toast('Import failed: ' + e.message, 4000); }
}
async function wipeAll() {
  if (!confirm('Delete ALL characters, stories, chats, World Books, personas and settings on this device?')) return;
  if (!confirm('This cannot be undone. Delete everything?')) return;
  for (const s of STORES) await DB.clear(s);
  location.hash = '#/chats'; location.reload();
}

/* ================= Boot ================= */
function fitViewport() {
  const vv = window.visualViewport; if (!vv) return;
  const f = () => { document.documentElement.style.setProperty('--app-h', vv.height + 'px'); document.documentElement.style.setProperty('--app-top', vv.offsetTop + 'px'); if (route().a === 'chat') scrollBottom(); };
  vv.addEventListener('resize', f); vv.addEventListener('scroll', f); f();
}
function makeIcon() {
  const c = document.createElement('canvas'); c.width = c.height = 180; const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 180, 180); g.addColorStop(0, '#a78bfa'); g.addColorStop(1, '#f472b6');
  x.fillStyle = '#0b0c17'; x.fillRect(0, 0, 180, 180);
  x.fillStyle = g; x.beginPath(); x.arc(90, 90, 58, 0, Math.PI * 2); x.fill();
  x.fillStyle = '#0b0c17'; x.beginPath(); x.arc(112, 74, 52, 0, Math.PI * 2); x.fill();
  const url = c.toDataURL('image/png'); $('#touchicon').href = url; $('#favicon').href = url;
}
window.addEventListener('hashchange', render);
window.addEventListener('error', e => toast('Error: ' + (e.message || 'unknown'), 4000));
window.addEventListener('unhandledrejection', e => toast('Error: ' + (e.reason?.message || e.reason || 'unknown'), 4000));
(async function boot() {
  makeIcon(); buildNav(); fitViewport();
  try { await openDB(); await loadAll(); }
  catch (e) { $('#view').innerHTML = empty('Storage unavailable', 'This browser blocked on-device storage (private browsing?). Open Lucid in a normal tab.'); return; }
  try { await navigator.storage?.persist?.(); } catch (e) {}
  render();
})();
</script>
</body>
</html>
